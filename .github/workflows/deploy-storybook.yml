name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/habitz-component-react-storybook-e85nyk
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        # enablement: true turns GitHub Pages on automatically (no manual setup).
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Build blog page (Vite app)
        run: npm run build

      # Assemble the site: Storybook at the root, the blog page under /blog.
      - name: Assemble site
        run: |
          mkdir -p public_site
          cp -r storybook-static/* public_site/
          mkdir -p public_site/blog
          cp -r dist/* public_site/blog/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
